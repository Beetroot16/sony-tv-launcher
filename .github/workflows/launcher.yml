name: launcher

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and build debug APK
        run: ./gradlew --no-daemon lint assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: launcher/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
