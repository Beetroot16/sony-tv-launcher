name: launcher-release

# Builds the signed release APK and attaches it to a GitHub Release.
# Triggered by publishing a release tagged launcher-vX.Y.Z, or manually for an existing tag.
# Signing key comes from repository secrets (never committed):
#   LAUNCHER_KEYSTORE_B64, LAUNCHER_KEYSTORE_PASSWORD, LAUNCHER_KEY_ALIAS, LAUNCHER_KEY_PASSWORD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. launcher-v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'launcher-v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "LAUNCHER_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tv-home.jks"
          {
            echo "storeFile=$RUNNER_TEMP/tv-home.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > launcher/keystore.properties
      - name: Lint and build release APK
        working-directory: launcher
        run: ./gradlew --no-daemon lint assembleRelease
      - name: Verify and rename
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -40
          VERSION="${TAG#launcher-}"
          cp "$APK" "tv-home-$VERSION.apk"
          ls -l "tv-home-$VERSION.apk"
          echo "ASSET=tv-home-$VERSION.apk" >> "$GITHUB_ENV"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-release
          path: launcher/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
